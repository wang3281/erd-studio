name: Bug report
description: Report a reproducible ERD Studio defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private schemas, credentials, or AI prompts. Report security issues through the private process in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic DDL or JSON only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Client / canvas
        - DDL parser or Smart Merge
        - Server / authentication
        - Project storage
        - AI integration
        - Deployment
    validations:
      required: true
